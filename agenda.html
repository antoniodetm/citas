<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas Médicas</title>

    <!-- Firebase SDK (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <!-- Carga de la librería FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>

    <!-- Estilos para la página -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            background-color: #f8f9fa;
            color: #333;
        }

        #calendar-container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: white;
            padding: 0.35rem 1rem 1rem 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .main-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0.35rem 0;
            margin-bottom: 0.25rem;
        }

        .main-nav button {
            padding: 7px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ced4da;
            background-color: white;
            color: #495057;
            transition: all 0.2s ease;
        }

        .main-nav button.active,
        .main-nav button:hover {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        .db-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #e9ecef;
            color: #6c757d;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .db-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .db-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        #calendar-container h1 {
            position: sticky;
            top: var(--nav-height, 42px);
            z-index: 99;
            background-color: white;
            text-align: center;
            color: #0056b3;
            font-size: 1.35rem;
            margin: 0;
            padding: 0.1rem 0 0.4rem 0;
        }

        /* 3ª y 4ª Fila: Barra de herramientas de FullCalendar */
        .fc .fc-header-toolbar {
            position: sticky;
            top: var(--toolbar-top, 85px);
            z-index: 98;
            background-color: white;
            padding: 0.35rem 0 0.5rem 0;
            margin-bottom: 0.5rem !important;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px 14px;
        }

        /* 3ª Fila: Navegación de fecha y Título de la fecha actual */
        .fc .fc-header-toolbar .fc-toolbar-chunk:nth-child(1) {
            order: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fc .fc-header-toolbar .fc-toolbar-chunk:nth-child(2) {
            order: 2;
            display: flex;
            align-items: center;
        }

        .fc .fc-toolbar-title {
            font-size: 1.2rem !important;
            font-weight: 700;
            color: #0056b3;
            text-transform: capitalize;
            margin: 0;
        }

        /* 4ª Fila: Vistas (Año, Mes, Semana) */
        .fc .fc-header-toolbar .fc-toolbar-chunk:nth-child(3) {
            order: 3;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        /* Personalización de los botones de FullCalendar */
        .fc-button-primary {
            background-color: #007bff !important;
            border-color: #007bff !important;
        }

        .fc-button-primary:hover {
            background-color: #0056b3 !important;
        }

        .fc-event {
            cursor: pointer;
        }

        /* Estilos para los números de los días (sin negrita) */
        .fc-daygrid-day-number {
            font-weight: normal !important;
        }

        /* Tamaño de los números en las vistas mensual y anual */
        .fc-dayGridMonth-view .fc-daygrid-day-number,
        .fc-multiMonthYear-view .fc-daygrid-day-number {
            font-size: 1.15em;
            font-weight: normal !important;
        }

        .fc-col-header-cell-cushion {
            font-weight: normal !important;
        }

        /* --- ESTILOS PARA LA VISTA ANUAL: Número arriba a la derecha y Punto centrado --- */
        .fc .fc-multimonth-day,
        .fc .fc-multiMonthYear-view .fc-daygrid-day {
            position: relative !important;
            height: 44px !important;
            min-height: 44px !important;
            vertical-align: top !important;
            padding: 0 !important;
        }

        .fc .fc-multimonth-day-frame,
        .fc .fc-multiMonthYear-view .fc-daygrid-day-frame {
            position: relative !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 44px !important;
            display: block !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        /* 1. Número del día: Anclado arriba a la derecha */
        .fc .fc-multimonth-day-number,
        .fc .fc-multiMonthYear-view .fc-daygrid-day-number,
        .fc .fc-multiMonthYear-view .fc-daygrid-day-top {
            position: absolute !important;
            top: 2px !important;
            right: 4px !important;
            font-size: 0.85rem !important;
            font-weight: normal !important;
            color: #333 !important;
            padding: 0 !important;
            margin: 0 !important;
            line-height: 1 !important;
            z-index: 2 !important;
            float: none !important;
        }

        /* 2. Punto de la cita: Centrado exactamente en medio de la casilla */
        .fc .fc-multimonth-day-events,
        .fc .fc-multiMonthYear-view .fc-daygrid-day-events {
            position: absolute !important;
            top: 55% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 3px !important;
            margin: 0 !important;
            padding: 0 !important;
            z-index: 1 !important;
            width: auto !important;
        }

        .fc .fc-multimonth-event,
        .fc .fc-multiMonthYear-view .fc-daygrid-event,
        .fc .fc-multiMonthYear-view .fc-daygrid-event-harness,
        .fc .fc-multiMonthYear-view .fc-event {
            width: 8px !important;
            height: 8px !important;
            min-width: 8px !important;
            min-height: 8px !important;
            border-radius: 50% !important;
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
            font-size: 0 !important;
            line-height: 0 !important;
            display: inline-block !important;
            cursor: pointer !important;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3) !important;
        }

        .fc-multiMonthYear-view .fc-event-main,
        .fc-multiMonthYear-view .fc-event-title,
        .fc-multiMonthYear-view .fc-event-time,
        .fc-multiMonthYear-view .fc-multimonth-event-time,
        .fc-multiMonthYear-view .fc-multimonth-event-title {
            display: none !important;
        }

        .fc-multiMonthYear-view .fc-multimonth-more-link,
        .fc-multiMonthYear-view .fc-daygrid-more-link {
            display: none !important;
        }

        /* --- ESTILOS PARA LA VISTA SEMANAL VERTICAL (listWeek) --- */
        .fc-theme-standard .fc-list {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .fc-list-day-cushion {
            background-color: #f1f5f9 !important;
            padding: 9px 14px !important;
            cursor: pointer;
            font-weight: 600 !important;
            color: #0056b3 !important;
            text-transform: capitalize;
        }

        .fc-list-day-cushion:hover {
            background-color: #e2e8f0 !important;
        }

        .fc-list-event {
            cursor: pointer !important;
            transition: background-color 0.15s ease;
        }

        .fc-list-event:hover td {
            background-color: #f8fafc !important;
        }

        .fc-list-event-dot {
            border-width: 6px !important;
        }

        .fc-list-event-time {
            font-weight: 600;
            color: #475569;
        }

        .fc-list-event-title {
            font-weight: 500;
            color: #1e293b;
        }

        .fc-list-empty {
            padding: 2rem 1rem !important;
            color: #64748b;
            font-style: italic;
        }

        /* --- ESTILOS PARA PANTALLAS GRANDES (Desktop) --- */
        @media (min-width: 768px) {
            body {
                padding: 1rem 2rem;
            }

            #calendar-container {
                padding: 0.4rem 1.5rem 1rem 1.5rem;
            }

            #calendar-container h1 {
                font-size: 1.5rem;
            }
        }

        /* --- ESTILOS PARA LA VENTANA MODAL --- */
        .modal {
            display: none;
            align-items: center;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 1rem auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .modal-content {
                margin: 8% auto;
            }
        }

        .close-button {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button:hover {
            color: #000;
        }

        .modal-content form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content label {
            font-weight: bold;
            font-size: 14px;
        }

        .modal-content input[type="text"],
        .modal-content input[type="time"],
        .modal-content select,
        .modal-content textarea {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-family: inherit;
        }

        .modal-content button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }

        .modal-content button:hover {
            background-color: #0056b3;
        }

        #delete-button {
            background-color: #dc3545;
        }

        #delete-button:hover {
            background-color: #c82333;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* --- ESTILOS PARA LA VISTA DE PACIENTES --- */
        #patients-view {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #patient-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 500px;
        }

        #patient-form input[type="text"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        #patient-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #patient-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        #patient-list .patient-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        #patient-list .patient-actions button {
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        #patient-list .patient-actions button:hover {
            background-color: #e2e6ea;
        }

        #patient-list .patient-actions .delete-patient-btn {
            color: #dc3545;
            border-color: #f5c6cb;
        }

        #patient-list .patient-actions .delete-patient-btn:hover {
            background-color: #f8d7da;
        }
    </style>
</head>

<body>

    <div class="main-nav">
        <button id="show-calendar-btn" class="active">Agenda</button>
        <button id="show-patients-btn">Pacientes</button>
        <span id="db-status" class="db-status">Conectando a Firebase...</span>
    </div>

    <div id="calendar-view">
        <div id="calendar-container">
            <h1>Agenda de Citas Médicas</h1>
            <!-- El calendario se renderizará aquí -->
            <div id="calendar"></div>
        </div>
    </div>

    <div id="patients-view">
        <h1>Gestión de Pacientes</h1>
        <form id="patient-form">
            <h3 id="patient-form-title">Añadir Nuevo Paciente</h3>
            <input type="hidden" id="patient-id-edit">
            <label for="patient-name">Nombre del Paciente:</label>
            <input type="text" id="patient-name" placeholder="Ej. Juan Pérez" required>
            <label for="patient-color">Color Predeterminado:</label>
            <input type="color" id="patient-color" value="#3788d8">
            <div class="modal-buttons">
                <button type="submit" id="patient-submit-btn">Guardar</button>
                <button type="button" id="cancel-patient-edit" style="display: none; background-color: #6c757d;">Cancelar</button>
            </div>
        </form>
        <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #dee2e6;">
        <h3>Lista de Pacientes</h3>
        <ul id="patient-list"></ul>
    </div>

    <!-- Modal para añadir / editar cita -->
    <div id="event-modal" class="modal">
        <div class="modal-content">
            <span id="close-button" class="close-button">&times;</span>
            <h2 id="modal-title">Añadir Nueva Cita</h2>
            <form id="event-form">
                <input type="hidden" id="event-id">
                <input type="hidden" id="event-date">

                <label for="event-patient-select">Paciente:</label>
                <select id="event-patient-select" required></select>

                <label for="event-start-time">Hora de Inicio:</label>
                <input type="time" id="event-start-time" required>

                <label for="event-color">Color:</label>
                <input type="color" id="event-color" value="#3788d8">

                <label for="event-notes">Notas:</label>
                <textarea id="event-notes" rows="3" placeholder="Detalles de la consulta, motivo, etc."></textarea>

                <div class="modal-buttons">
                    <button type="submit" id="event-submit-btn">Guardar Cambios</button>
                    <button type="button" id="delete-button">Eliminar Cita</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyArwel_EcbrX8gFogXAwDOwlmUDqsi0hTA",
            authDomain: "compras-58fd2.firebaseapp.com",
            projectId: "compras-58fd2",
            storageBucket: "compras-58fd2.firebasestorage.app",
            messagingSenderId: "591579835512",
            appId: "1:591579835512:web:8da32af8f587dbfafb918d"
        };

        // Inicializar Firebase y Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Activar persistencia offline de Firestore
        db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
            if (err.code === 'failed-precondition') {
                console.warn("Persistencia offline falló: Múltiples pestañas abiertas.");
            } else if (err.code === 'unimplemented') {
                console.warn("El navegador no soporta persistencia offline.");
            }
        });

        // Esperamos a que todo el contenido del HTML esté cargado
        document.addEventListener('DOMContentLoaded', function () {
            const statusEl = document.getElementById('db-status');
            const calendarEl = document.getElementById('calendar');
            let patients = [];

            // Actualizar indicador de estado
            function setStatus(text, className) {
                if (statusEl) {
                    statusEl.innerText = text;
                    statusEl.className = 'db-status ' + className;
                }
            }

            // --- LÓGICA DE NAVEGACIÓN ---
            setupNavigation();

            // Detectamos si la pantalla es pequeña (móvil)
            const isMobile = window.innerWidth < 768;

            // Inicializamos el objeto FullCalendar
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,today,next',
                    center: 'title',
                    right: 'multiMonthYear,dayGridMonth,listWeek'
                },

                locale: 'es',
                firstDay: 1, // La semana comienza en Lunes (1) y termina en Domingo
                initialDate: new Date(),
                height: 'auto',
                forceEventDuration: true,
                defaultTimedEventDuration: '00:30',
                navLinks: true,
                editable: true,

                views: {
                    dayGridMonth: {},
                    listWeek: {
                        buttonText: 'Semana',
                        dayHeaderFormat: { weekday: 'long', day: 'numeric', month: 'long' }
                    },
                    multiMonthYear: {
                        dayMaxEvents: false,
                        dayMaxEventRows: false
                    }
                },

                buttonText: {
                    today: 'Hoy',
                    year: 'Año',
                    month: 'Mes',
                    week: 'Semana',
                    list: 'Semana',
                    listWeek: 'Semana'
                },

                events: [], // Los eventos se cargan en tiempo real desde Firebase

                eventDidMount: function (info) {
                    if (info.view.type === 'dayGridMonth' || info.view.type === 'multiMonthYear') {
                        const eventTitleEl = info.el.querySelector('.fc-event-title') || info.el.querySelector('.fc-multimonth-event-title');
                        if (eventTitleEl) {
                            eventTitleEl.remove();
                        }
                    }
                    if (info.view.type === 'multiMonthYear') {
                        const timeStr = info.event.start ? new Date(info.event.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                        info.el.title = `${info.event.title}${timeStr ? ' (' + timeStr + ')' : ''}`;
                    }
                },

                eventClick: function (info) {
                    openModal(null, info.event);
                },

                dateClick: function (info) {
                    openModal(info.dateStr);
                },

                // Guardar cambios al arrastrar cita en el calendario
                eventDrop: async function (info) {
                    try {
                        const event = info.event;
                        await db.collection('citas').doc(event.id).update({
                            start: event.startStr,
                            end: event.endStr || null
                        });
                    } catch (error) {
                        console.error("Error al mover cita en Firebase:", error);
                        alert("Error al actualizar la fecha en Firebase.");
                        info.revert();
                    }
                },

                // Guardar cambios al redimensionar cita
                eventResize: async function (info) {
                    try {
                        const event = info.event;
                        await db.collection('citas').doc(event.id).update({
                            start: event.startStr,
                            end: event.endStr || null
                        });
                    } catch (error) {
                        console.error("Error al redimensionar cita en Firebase:", error);
                        alert("Error al actualizar la duración en Firebase.");
                        info.revert();
                    }
                },

                datesSet: function (dateInfo) {
                    updateStickyHeaderOffsets();
                    if (dateInfo.view.type === 'multiMonthYear') {
                        const today = new Date();
                        const currentMonthEl = calendarEl.querySelector(`.fc-multimonth-month[data-date^="${today.toISOString().slice(0, 7)}"]`);
                        if (currentMonthEl) {
                            currentMonthEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            });

            function updateStickyHeaderOffsets() {
                const mainNav = document.querySelector('.main-nav');
                const calendarH1 = document.querySelector('#calendar-container h1');
                if (mainNav) {
                    const navHeight = mainNav.offsetHeight;
                    document.documentElement.style.setProperty('--nav-height', `${navHeight}px`);
                    if (calendarH1) {
                        const h1Height = calendarH1.offsetHeight;
                        document.documentElement.style.setProperty('--toolbar-top', `${navHeight + h1Height}px`);
                    }
                }
            }

            window.addEventListener('resize', updateStickyHeaderOffsets);
            calendar.render();
            updateStickyHeaderOffsets();

            // Permitir hacer clic en las cabeceras de día de la vista semanal vertical para añadir cita
            calendarEl.addEventListener('click', function (e) {
                const listDayCushion = e.target.closest('.fc-list-day-cushion');
                if (listDayCushion) {
                    const listDayRow = listDayCushion.closest('.fc-list-day');
                    if (listDayRow && listDayRow.dataset.date) {
                        openModal(listDayRow.dataset.date);
                    }
                }
            });

            // --- LÓGICA DE SINCRONIZACIÓN CON FIREBASE ---

            // 1. Escuchar citas en tiempo real desde Firestore
            db.collection('citas').onSnapshot((snapshot) => {
                const events = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    events.push({
                        id: doc.id,
                        title: data.title || 'Cita',
                        start: data.start,
                        end: data.end || null,
                        backgroundColor: data.backgroundColor || '#007bff',
                        borderColor: data.borderColor || '#007bff',
                        extendedProps: {
                            notes: data.notes || '',
                            patientId: data.patientId || ''
                        }
                    });
                });

                // Reemplazar eventos en FullCalendar
                calendar.removeAllEvents();
                calendar.addEventSource(events);
                setStatus('🟢 Firebase Conectado', 'connected');
            }, (error) => {
                console.error("Error al sincronizar citas desde Firebase:", error);
                setStatus('🔴 Error de conexión', 'error');
            });

            // 2. Escuchar pacientes en tiempo real desde Firestore
            db.collection('pacientes').onSnapshot(async (snapshot) => {
                // Si la base de datos está vacía, comprobar si hay pacientes en localStorage para migrar
                if (snapshot.empty) {
                    const storedPatients = localStorage.getItem('medicalAgendaPatients');
                    if (storedPatients) {
                        try {
                            const parsed = JSON.parse(storedPatients);
                            if (parsed.length > 0) {
                                console.log("Migrando pacientes de localStorage a Firebase...");
                                const batch = db.batch();
                                parsed.forEach(p => {
                                    const ref = db.collection('pacientes').doc(p.id);
                                    batch.set(ref, {
                                        name: p.name,
                                        color: p.color || '#3788d8',
                                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                    });
                                });
                                await batch.commit();
                                localStorage.removeItem('medicalAgendaPatients');
                                return; // el snapshot se disparará nuevamente con los datos
                            }
                        } catch (e) {
                            console.error("Error al migrar datos locales:", e);
                        }
                    }
                }

                patients = [];
                snapshot.forEach((doc) => {
                    patients.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Ordenar alfabéticamente por nombre
                patients.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

                renderPatientList();
                populatePatientSelect();
            }, (error) => {
                console.error("Error al sincronizar pacientes desde Firebase:", error);
                setStatus('🔴 Error de conexión: ' + (error.message || ''), 'error');
            });

            // --- LÓGICA DE LA VENTANA MODAL DE CITAS ---
            const modal = document.getElementById('event-modal');
            const modalTitle = document.getElementById('modal-title');
            const closeModalButton = document.getElementById('close-button');
            const eventForm = document.getElementById('event-form');
            const eventIdInput = document.getElementById('event-id');
            const eventDateInput = document.getElementById('event-date');
            const deleteButton = document.getElementById('delete-button');
            const patientSelect = document.getElementById('event-patient-select');

            const formatTime = (date) => date ? new Date(date).toTimeString().slice(0, 5) : '';

            function openModal(date, event = null) {
                eventForm.reset();
                populatePatientSelect();

                if (event) { // Modo Edición
                    modalTitle.innerText = 'Editar Cita';
                    eventIdInput.value = event.id;
                    patientSelect.value = event.extendedProps.patientId || '';
                    eventDateInput.value = event.start.toISOString().slice(0, 10);
                    document.getElementById('event-start-time').value = formatTime(event.start);
                    document.getElementById('event-color').value = event.backgroundColor || '#007bff';
                    document.getElementById('event-notes').value = event.extendedProps.notes || '';
                    deleteButton.style.display = 'block';
                } else { // Modo Creación
                    modalTitle.innerText = 'Añadir Nueva Cita';
                    eventIdInput.value = '';
                    eventDateInput.value = date;
                    document.getElementById('event-start-time').value = '10:00';
                    updateColorFromPatient();
                    document.getElementById('event-notes').value = '';
                    deleteButton.style.display = 'none';
                }

                modal.style.display = 'flex';
                if (patientSelect) patientSelect.focus();
            }

            function closeModal() {
                modal.style.display = 'none';
            }

            closeModalButton.onclick = closeModal;
            window.onclick = function (event) {
                if (event.target === modal) {
                    closeModal();
                }
            };

            // Eliminar Cita en Firestore
            deleteButton.onclick = async function () {
                const eventId = eventIdInput.value;
                if (eventId && confirm('¿Estás seguro de que quieres eliminar esta cita?')) {
                    try {
                        await db.collection('citas').doc(eventId).delete();
                        closeModal();
                    } catch (error) {
                        console.error("Error al eliminar cita de Firebase:", error);
                        alert("Error al eliminar la cita: " + error.message);
                    }
                }
            };

            // Guardar / Editar Cita en Firestore
            eventForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const selectedPatientId = patientSelect.value;
                const patient = patients.find(p => p.id === selectedPatientId);
                if (!patient) {
                    alert('Por favor, selecciona un paciente válido.');
                    return;
                }

                const title = patient.name;
                const date = eventDateInput.value;
                const startTime = document.getElementById('event-start-time').value;
                const color = document.getElementById('event-color').value;
                const notes = document.getElementById('event-notes').value;
                const eventId = eventIdInput.value;

                const eventData = {
                    title: title,
                    start: `${date}T${startTime}`,
                    backgroundColor: color,
                    borderColor: color,
                    notes: notes,
                    patientId: selectedPatientId,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    if (eventId) {
                        await db.collection('citas').doc(eventId).update(eventData);
                    } else {
                        eventData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        await db.collection('citas').add(eventData);
                    }
                    closeModal();
                } catch (error) {
                    console.error("Error al guardar cita en Firebase:", error);
                    alert("Error al guardar la cita en Firebase: " + error.message);
                }
            });

            // --- LÓGICA DE PACIENTES CON FIREBASE ---
            function setupPatientManagement() {
                const patientFormTitle = document.getElementById('patient-form-title');
                const patientForm = document.getElementById('patient-form');
                const patientIdEditInput = document.getElementById('patient-id-edit');
                const patientNameInput = document.getElementById('patient-name');
                const patientColorInput = document.getElementById('patient-color');
                const cancelPatientEditBtn = document.getElementById('cancel-patient-edit');

                // Guardar / Editar Paciente en Firestore
                patientForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const patientId = patientIdEditInput.value;
                    const name = patientNameInput.value.trim();
                    const color = patientColorInput.value;

                    if (!name) return;

                    try {
                        if (patientId) {
                            // Actualizar paciente
                            await db.collection('pacientes').doc(patientId).update({
                                name: name,
                                color: color,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            // Actualizar en cascada las citas de este paciente
                            const citasSnapshot = await db.collection('citas').where('patientId', '==', patientId).get();
                            if (!citasSnapshot.empty) {
                                const batch = db.batch();
                                citasSnapshot.forEach(doc => {
                                    batch.update(doc.ref, {
                                        title: name,
                                        backgroundColor: color,
                                        borderColor: color
                                    });
                                });
                                await batch.commit();
                            }
                        } else {
                            // Crear nuevo paciente
                            await db.collection('pacientes').add({
                                name: name,
                                color: color,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                        resetPatientForm();
                    } catch (error) {
                        console.error("Error al guardar paciente en Firebase:", error);
                        alert("Error al guardar paciente: " + error.message);
                    }
                });

                cancelPatientEditBtn.addEventListener('click', resetPatientForm);

                document.getElementById('patient-list').addEventListener('click', function (e) {
                    handlePatientListActions(e);
                });
            }

            function renderPatientList() {
                const listEl = document.getElementById('patient-list');
                listEl.innerHTML = '';

                if (patients.length === 0) {
                    listEl.innerHTML = '<li style="color: #6c757d; font-style: italic;">No hay pacientes registrados aún.</li>';
                    return;
                }

                patients.forEach(p => {
                    const item = document.createElement('li');
                    item.innerHTML = `
                        <span style="width: 18px; height: 18px; background-color: ${p.color}; border-radius: 50%; display: inline-block; flex-shrink: 0;"></span>
                        <span style="font-weight: 500;">${p.name}</span>
                        <div class="patient-actions">
                            <button class="edit-patient-btn" data-id="${p.id}">Editar</button>
                            <button class="delete-patient-btn" data-id="${p.id}">Eliminar</button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }

            async function handlePatientListActions(e) {
                const patientId = e.target.dataset.id;
                if (!patientId) return;

                if (e.target.classList.contains('edit-patient-btn')) {
                    const patient = patients.find(p => p.id === patientId);
                    if (patient) {
                        document.getElementById('patient-form-title').innerText = 'Editar Paciente';
                        document.getElementById('patient-id-edit').value = patient.id;
                        document.getElementById('patient-name').value = patient.name;
                        document.getElementById('patient-color').value = patient.color;
                        document.getElementById('cancel-patient-edit').style.display = 'inline-block';
                        document.getElementById('patient-name').focus();
                    }
                }

                if (e.target.classList.contains('delete-patient-btn')) {
                    try {
                        const citasSnapshot = await db.collection('citas').where('patientId', '==', patientId).get();
                        if (!citasSnapshot.empty) {
                            alert('No se puede eliminar este paciente porque tiene ' + citasSnapshot.size + ' cita(s) asignada(s). Por favor, elimine o reasigne sus citas primero.');
                            return;
                        }

                        if (confirm('¿Estás seguro de que quieres eliminar a este paciente?')) {
                            await db.collection('pacientes').doc(patientId).delete();
                        }
                    } catch (error) {
                        console.error("Error al eliminar paciente de Firebase:", error);
                        alert("Error al eliminar paciente: " + error.message);
                    }
                }
            }

            function resetPatientForm() {
                document.getElementById('patient-form-title').innerText = 'Añadir Nuevo Paciente';
                document.getElementById('patient-form').reset();
                document.getElementById('patient-id-edit').value = '';
                document.getElementById('cancel-patient-edit').style.display = 'none';
            }

            function populatePatientSelect() {
                patientSelect.innerHTML = '<option value="">-- Selecciona un paciente --</option>';
                patients.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.innerText = p.name;
                    patientSelect.appendChild(option);
                });
            }

            function updateColorFromPatient() {
                const selectedPatient = patients.find(p => p.id === patientSelect.value);
                if (selectedPatient) {
                    document.getElementById('event-color').value = selectedPatient.color;
                }
            }

            patientSelect.addEventListener('change', updateColorFromPatient);

            function setupNavigation() {
                const calBtn = document.getElementById('show-calendar-btn');
                const patBtn = document.getElementById('show-patients-btn');
                const calView = document.getElementById('calendar-view');
                const patView = document.getElementById('patients-view');

                calBtn.addEventListener('click', () => {
                    calView.style.display = 'block';
                    patView.style.display = 'none';
                    calBtn.classList.add('active');
                    patBtn.classList.remove('active');
                    calendar.render();
                    updateStickyHeaderOffsets();
                });

                patBtn.addEventListener('click', () => {
                    calView.style.display = 'none';
                    patView.style.display = 'block';
                    patBtn.classList.add('active');
                    calBtn.classList.remove('active');
                });
            }

            // Inicializar la gestión de pacientes
            setupPatientManagement();
        });
    </script>

</body>

</html>
